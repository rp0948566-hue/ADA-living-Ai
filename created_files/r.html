<!DOCTYPE html>
<html>
<head>
    <title>Futuristic Website</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
        }
        .animation-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .glowing-text {
            font-size: 3em;
            color: #fff;
            text-shadow: 0 0 20px #0ff, 0 0 30px #0ff, 0 0 40px #0ff;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            0% { text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 30px #0ff; }
            100% { text-shadow: 0 0 20px #0ff, 0 0 30px #0ff, 0 0 40px #0ff; }
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <div class="glowing-text">Welcome to the Future</div>
    </div>
    <script>
        /* Optional: Add more advanced animations with JavaScript here */
    </script>
</body>
</html>
