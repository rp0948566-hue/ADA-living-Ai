[package]
name = "jeb-core"
version = "0.1.0"
edition = "2021"
description = "Real-time air traffic data backend for Jeb: OpenSky + adsb.lol + Planespotters, cached, no fake data"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
